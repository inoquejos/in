name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/remover-inoque-receptor-kahzd7
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita dois deploys rodando ao mesmo tempo (mas deixa a fila terminar, não cancela em andamento).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacota o site (raiz do repo, sem build)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
